name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        # 不再固定 gradle-version：仓库里已提交 wrapper，./gradlew 会自己装 8.9

      # keystore 只以 Secrets 形式存在，仓库里没有。每次构建解出同一个文件，
      # 所以签名证书恒定；换用每次新生成的 debug.keystore 会让覆盖安装报签名不一致，
      # 用户只能卸载重装，而卸载会把通知使用权和短信权限一起清掉。
      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.BILLTRACE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::secret BILLTRACE_KEYSTORE_B64 is not set"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/billtrace.p12"
          echo "BILLTRACE_KEYSTORE=$RUNNER_TEMP/billtrace.p12" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          BILLTRACE_KEY_PASSWORD: ${{ secrets.BILLTRACE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # 每次构建都把期望指纹和 APK 里实际的签名证书打出来，两次运行的值必须相同。
      - name: Verify signature
        env:
          BILLTRACE_KEY_PASSWORD: ${{ secrets.BILLTRACE_KEY_PASSWORD }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          echo "--- keystore cert ---"
          openssl pkcs12 -in "$BILLTRACE_KEYSTORE" -nokeys -clcerts \
            -passin env:BILLTRACE_KEY_PASSWORD 2>/dev/null \
            | openssl x509 -noout -subject -enddate -fingerprint -sha256
          echo "--- apk signer ---"
          SIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" ~/.gradle \
            -type f -name apksigner 2>/dev/null | head -1)
          if [ -n "$SIGNER" ]; then
            "$SIGNER" verify --verbose --print-certs "$APK"
          else
            echo "::warning::apksigner not found on runner, skipped cert print"
          fi

      - name: Prepare artifact
        run: |
          mkdir -p staging
          cp app/build/outputs/apk/release/app-release.apk staging/BillTrace.apk
          # 站上的下载链一直指向 BillTrace-debug.apk，保留同名副本一年，避免旧链接 404。
          cp app/build/outputs/apk/release/app-release.apk staging/BillTrace-debug.apk

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 版本号从 build.gradle 取，避免标题和实际构建脱节
          VER=$(grep -E '^\s*versionName ' app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          [ -n "$VER" ] || { echo "::error::versionName not found in app/build.gradle"; exit 1; }
          echo "release version: $VER"
          # create 只在第一次成功；之后必须 edit，否则标题和说明会永远停在首个构建
          gh release create latest --title "账迹 BillTrace v$VER" --notes-file docs/release-notes.md --latest \
            || gh release edit latest --title "账迹 BillTrace v$VER" --notes-file docs/release-notes.md
          gh release upload latest staging/BillTrace.apk --clobber
          gh release upload latest staging/BillTrace-debug.apk --clobber
          # 断言：说明真的写进去了，而不是只有资产被覆盖
          gh release view latest --json body --jq .body | grep -q "$VER" \
            || { echo "::error::release notes were not updated"; exit 1; }
