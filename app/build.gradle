plugins {
    id 'com.android.application'
}

// 签名材料只从环境变量进来，仓库里不放 keystore。CI 用 GitHub Secrets 注入。
def ksPath = System.getenv('BILLTRACE_KEYSTORE')
def ksPass = System.getenv('BILLTRACE_KEY_PASSWORD')

android {
    namespace 'com.voyra.billtrace'
    compileSdk 34

    defaultConfig {
        applicationId "com.voyra.billtrace"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "0.4.2"
    }

    signingConfigs {
        release {
            if (ksPath && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias 'billtrace'
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
