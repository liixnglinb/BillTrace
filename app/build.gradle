plugins {
    id 'com.android.application'
}

android {
    namespace 'com.voyra.billtrace'
    compileSdk 34

    defaultConfig {
        applicationId "com.voyra.billtrace"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
